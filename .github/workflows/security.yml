# Dependency vulnerability scanning (S2).
# - Dependency graph submission -> GitHub Dependabot alerts (Security tab).
# - Dependency review: blocks a pull request that adds a dependency with a known high/critical hole.
# - OSV-Scanner: checks every pinned dependency (gradle/verification-metadata.xml) against the
#   OSV database on each push/PR and weekly, results in Security -> Code scanning.
name: Security

on:
  push:
    branches-ignore: [dependabot/**]
  pull_request:
  schedule:
    - cron: "30 3 * * 1" # Mondays 03:30 UTC (09:00 IST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-submission:
    # Fork PRs get no write token; same-repo PRs and pushes submit their graph.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
      - uses: gradle/actions/dependency-submission@v6
        with:
          # If the repository's Dependency graph setting is off, warn instead of failing the run
          # (Settings -> Code security -> Dependency graph -> Enable).
          dependency-graph-continue-on-failure: true

  dependency-review:
    if: github.event_name == 'pull_request'
    needs: dependency-submission
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          retry-on-snapshot-warnings: true
          comment-summary-in-pr: on-failure

  osv-scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
    with:
      scan-args: |-
        --recursive
        ./
      upload-sarif: true
      fail-on-vuln: ${{ github.event_name == 'pull_request' }}
