# Dependency vulnerability scanning (S2).
# - Dependency graph submission -> GitHub Dependabot alerts (Security tab).
# - Dependency review: blocks a pull request that adds a dependency with a known high/critical hole.
# - OSV-Scanner: checks the dependencies that ship in the app (release runtime classpath) against
#   the OSV database on each push/PR and weekly, results in Security -> Code scanning. Fails PRs.
name: Security

on:
  push:
    branches-ignore: [dependabot/**]
  pull_request:
  schedule:
    - cron: "30 3 * * 1" # Mondays 03:30 UTC (09:00 IST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-submission:
    # Fork PRs get no write token; same-repo PRs and pushes submit their graph.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
      - uses: gradle/actions/dependency-submission@v6
        with:
          # If the repository's Dependency graph setting is off, warn instead of failing the run
          # (Settings -> Code security -> Dependency graph -> Enable).
          dependency-graph-continue-on-failure: true

  dependency-review:
    if: github.event_name == 'pull_request'
    needs: dependency-submission
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          retry-on-snapshot-warnings: true
          comment-summary-in-pr: on-failure

  # OSV-Scanner on what actually SHIPS in the app (the release runtime classpath), not on
  # gradle/verification-metadata.xml: that file also pins every build tool (AGP, lint, Kotlin
  # compiler, test runners), whose advisories never reach users' phones and made every PR fail.
  # Build-tool advisories are still raised to fixed versions (security floors in settings.gradle.kts)
  # and still show as Dependabot alerts via the dependency graph submitted above.
  osv-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build

      - name: Write lockfile of shipped dependencies
        run: |
          mkdir -p osv
          ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath > osv/tree.txt
          # "group:name:version" (the resolved version after "->") in Gradle lockfile format.
          sed -nE 's/^[| \\+-]*--- ([^ :]+:[^ :]+):([^ ]+)( -> ([^ ]+))?.*/\1:\2 \4/p' osv/tree.txt \
            | awk '{split($1,a,":"); v=($2!="")?$2:a[3]; print a[1]":"a[2]":"v"=releaseRuntimeClasspath"}' \
            | grep -v '^project' | sort -u > osv/gradle.lockfile
          echo "$(wc -l < osv/gradle.lockfile) shipped dependencies"
          test -s osv/gradle.lockfile

      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.1
        # Fails pull requests on a known vulnerability in shipped code; reports only on pushes/schedule.
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        with:
          scan-args: |-
            --format=sarif
            --output=results.sarif
            --lockfile=osv/gradle.lockfile

      - name: Upload results to Security -> Code scanning
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: osv-scanner
